run_name: correct_data_features_4new_wavlm_cdm_cim_fusion_head
experiment_name: correct_data_features_4new_wavlm_cdm_cim_fusion_head
output_dir: results/correct_data/features/4new/wavlm/cdm_cim_fusion_head
seed: 42
dataset:
  name: iemocap
  iemocap_root: data/iemocap
  auto_download: true
  kaggle_dataset: sangayb/iemocap
  test_session: 5
  validation_ratio: 0.1
  sampling_rate: 16000
  max_duration_seconds: null
model:
  wavlm_model_name: microsoft/wavlm-base
  freeze_wavlm: true
  unfreeze_last_n_layers: 0
  num_labels: 4
  memory_dim: 128
  temporal_feature_set: cim_4_new
  temporal_feature_dim: 4
  temporal_emb_dim: 64
  temporal_hidden_dim: 64
  dropout: 0.2
  alpha_init: 0.0
  beta_init: 0.0
  fusion_mode: residual_gated
  fix_alpha_zero: false
  fix_beta_zero: false
  temporal_input_mode: real
  disabled_temporal_feature_groups: []
  disabled_temporal_features: []
  temporal_shuffle_seed: 0
  short_gap_threshold: 0.3
  long_gap_threshold: 1.0
  overlap_threshold: 0.05
  temporal_feature_mode: real
precompute:
  enabled: true
  pooling: mean
  cache_path: results/correct_data/shared_cache/wavlm_mean_embeddings.pt
  force_recompute: false
  batch_size: 16
cross_session:
  enabled: true
  test_sessions:
  - 1
  - 2
  - 3
  - 4
  - 5
  run_name: null
training:
  device: auto
  batch_mode: dialogue
  batch_size: 16
  eval_batch_size: 16
  max_epochs: 150
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  warmup_ratio: 0.1
  gradient_clip: 1.0
  selection_metric: UA
  use_class_weights: false
  num_workers: 0
  progress_bar: false
training_stage:
  mode: branch_pretrain_fusion_head
  stage_1_epochs: 150
  stage_2_epochs: 150
  stage_3_epochs: 50
  stage_1_train_dialogue_branch: true
  stage_2_train_temporal_branch: true
  stage_3_train_fusion_head: true
analysis:
  strong_overlap_threshold: 0.25
wandb:
  use_wandb: true
  project: conversational-SER
  run_name: correct_data_features_4new_wavlm_cdm_cim_fusion_head
  entity: null
  mode: online
