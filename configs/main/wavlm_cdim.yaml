run_name: main_wavlm_cdim
experiment_name: main_wavlm_cdim
output_dir: results/main/wavlm/cdim
seed: 42
dataset:
  name: iemocap
  iemocap_root: data/iemocap
  auto_download: true
  kaggle_dataset: sangayb/iemocap
  test_session: 5
  validation_ratio: 0.1
  sampling_rate: 16000
  max_duration_seconds: null
model:
  wavlm_model_name: microsoft/wavlm-base
  freeze_wavlm: true
  unfreeze_last_n_layers: 0
  num_labels: 4
  memory_dim: 128
  temporal_feature_set: interaction_4
  temporal_feature_dim: 4
  temporal_emb_dim: 64
  temporal_hidden_dim: 64
  dropout: 0.2
  residual_gate_init: 0.0
  memory_input_mode: full
  memory_fusion_mode: concat
  temporal_input_mode: real
  disabled_temporal_feature_groups: []
  disabled_temporal_features: []
  temporal_shuffle_seed: 0
  short_gap_threshold: 0.3
  long_gap_threshold: 1.0
  overlap_threshold: 0.05
  use_temporal_features: true
  temporal_feature_mode: real
precompute:
  enabled: true
  pooling: mean
  cache_path: results/shared_cache/wavlm_mean_embeddings.pt
  force_recompute: false
  batch_size: 16
cross_session:
  enabled: true
  test_sessions:
  - 1
  - 2
  - 3
  - 4
  - 5
  run_name: null
training:
  device: auto
  batch_mode: dialogue
  batch_size: 16
  eval_batch_size: 16
  max_epochs: 150
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  warmup_ratio: 0.1
  gradient_clip: 1.0
  selection_metric: UA
  use_class_weights: false
  num_workers: 0
  progress_bar: true
training_stage:
  mode: end_to_end
evaluation:
  strong_overlap_threshold: 0.25
wandb:
  use_wandb: true
  project: conversational-SER
  run_name: main_wavlm_cdim
  entity: null
  mode: online
